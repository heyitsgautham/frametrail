[project]
name = "frametrail"
version = "0.1.0"
description = "Read-only intake, recovery, timeline and provenance for recorder evidence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
]

[project.scripts]
frametrail = "frametrail.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
